services:
  app:
    build:
      context: .
      target: deps
    image: mondio-dev
    working_dir: /app
    command: pnpm dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      - VITE_HOST=0.0.0.0

  prod:
    build:
      context: .
      target: production
    image: mondio-prod
    ports:
      - "8080:80"
    profiles:
      - prod

volumes:
  app_node_modules:
